name: Validate app

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite, mbstring, dom, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - name: Install test dependencies
        run: |
          npm ci --no-audit --no-fund
          composer install --no-scripts --no-interaction --no-progress --prefer-dist
          composer bin phpunit install --no-interaction --no-progress --prefer-dist
      - name: PHP tests and syntax
        run: |
          composer test:unit
          composer lint
      - name: Frontend checks and production build
        run: |
          npm run lint
          npm run stylelint
          npm run test:frontend
          npm run build
